name: Android standalone build
# Rebuild the latest reviewed TASNIM TRAVEL release
# Strict TypeScript validation is required before APK packaging

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate branded PNG icon and splash assets
        run: |
          npm install --no-save sharp
          node scripts/generate-brand-assets.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build separate ARM APKs
        working-directory: android/app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          s = p.read_text()
          marker = 'android {'
          block = """android {
              splits {
                  abi {
                      enable true
                      reset()
                      include 'armeabi-v7a', 'arm64-v8a'
                      universalApk false
                  }
              }
          """
          if marker not in s:
              raise SystemExit('Could not find Android Gradle block')
          if 'universalApk false' not in s:
              s = s.replace(marker, block, 1)
          p.write_text(s)
          PY
      - name: Enable Android release size optimizations
        working-directory: android
        run: |
          {
            echo ""
            echo "# Reduce release APK size with R8 and unused-resource shrinking"
            echo "android.enableMinifyInReleaseBuilds=true"
            echo "android.enableShrinkResourcesInReleaseBuilds=true"
          } >> gradle.properties
          echo "Release optimizations enabled:"
          tail -n 5 gradle.properties
      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency download failed; retrying in $((attempt * 20)) seconds..."
              sleep $((attempt * 20))
            fi
          done
          exit 1
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: tasnim-travel-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
